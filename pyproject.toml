[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oncoct"
version = "0.1.0"
description = "Autonomous oncology CT pipeline: detect, segment, measure, classify, and report lung nodules via an LLM tool-calling agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "oncoct" }]

# Core env deps. NOTE: MedSAM2 pins an incompatible torch/CUDA stack and lives in a
# separate conda env (envs/medsam2.yml); it is intentionally NOT listed here.
dependencies = [
    "torch>=2.2",
    "numpy>=1.26",
    "SimpleITK>=2.3",
    "nibabel>=5.2",
    "monai>=1.3",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.12",
    "pandas>=2.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
labels = ["pylidc>=0.2.3"]
radiomics = ["pyradiomics>=3.1"]
detect = ["totalsegmentator>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.4", "hypothesis>=6.100"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
