# Primary conda env for oncoct (agent, preprocessing, MONAI/TotalSegmentator, eval).
# MedSAM2 has a conflicting torch/CUDA pin and lives in envs/medsam2.yml instead.
name: oncoct
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch>=2.2
      - numpy>=1.26
      - SimpleITK>=2.3
      - nibabel>=5.2
      - monai>=1.3
      - totalsegmentator>=2.4
      - pydantic>=2.6
      - pyyaml>=6.0
      - scipy>=1.12
      - pandas>=2.2
      - pylidc>=0.2.3
      - pyradiomics>=3.1
      - pytest>=8.0
      - ruff>=0.4
      - hypothesis>=6.100
